function koRoundName(size,round) {
    const teamsLeft = size / (2**round);
    if(teamsLeft<=2) return 'Finale';
    if(teamsLeft===4) return 'Semifinali';
    if(teamsLeft===8) return 'Quarti di finale';
    if(teamsLeft===16) return 'Ottavi di finale';
    if(teamsLeft===32) return 'Sedicesimi di finale';
    return 'Turno dei '+teamsLeft;
}
function koWinner(m) {
    if(!m||!scoreCompleted(m))return null;
    if(sportNow()==='padel'&&m.padelResult){const v=v8Calc(m)?.win;return v==='a'?m.ta:v==='b'?m.tb:null;}
    const r=R(m);if(+r.a===+r.b)return null;
    return +r.a>+r.b?m.ta:m.tb;
}
function koLoser(m){const w=koWinner(m);return w?(w===m.ta?m.tb:m.ta):null;}
function koMatch(round,pos) {
    return torneo.matches.find(m=>m.stage==='ko'&&m.round===round&&m.bracketPos===pos);
}
// I gironi confermati innescano i quarti/semifinali; ogni ultimo punteggio
// confermato nel turno in corso apre il turno successivo senza pulsanti.
// I turni dei playoff sono prenotati tutti insieme: gli incontri futuri restano
// segnaposto finché non sono noti ENTRAMBI gli avversari. Mai avanzamenti fittizi.
function playoffSlot(start, index) {
    const d=torneo.timePerSlot||20;
    const base=tmin(start)||600;
    return [hm(base+index*d),hm(base+(index+1)*d)];
}
function startFinals() {
    if(!finalsReady()||torneo.knockout)return false;
    const qualified=qualifiedTeams();if(qualified.length<2)return false;
    const size=2**Math.ceil(Math.log2(qualified.length));
    const seeds=arrangeSeeds(qualified,size),teams=Object.fromEntries(teamsNow().map(t=>[t.id,t]));
    const courtCount=Math.max(1,torneo.numCourts||1),rounds=Math.log2(size);
    const games=[],slots=[],base=torneo.slots.length;
    const start=torneo.slots.at(-1)?.[1]||torneo.startTime||'10:00';
    let v8NextTime=tmin(start)||600;
    // Ogni fase ha i propri orari già fissati. Il primo turno non occupa campi
    // per i BYE, che invece sono rappresentati chiaramente nell'albero.
    for(let round=0;round<rounds;round++){
        const positions=size/(2**(round+1));
        const active=[];
        for(let pos=0;pos<positions;pos++){
            const ta=round===0?seeds[2*pos]:null,tb=round===0?seeds[2*pos+1]:null;
            if(round===0&&(!ta||!tb))continue;
            active.push({stage:'ko',round,bracketPos:pos,ta,tb,official:true,
                ...(round===0?{a:teams[ta].members.slice(),b:teams[tb].members.slice()}:{fr:1,pending:true})});
        }
        // Ogni fase occupa almeno un turno; saranno visibili subito anche
        // semifinali/finale e non occorrerà aggiungerle man mano.
        const slotCount=Math.max(1,Math.ceil(active.length/courtCount));
        const slotOffset=slots.length;
        for(let i=0;i<slotCount;i++){
            const desired=sportNow()==='padel'?(round===rounds-1?v8Cfg().finalMinutes:v8Cfg().koMinutes):torneo.timePerSlot;
            const dur=Math.max(10,Math.min(240,+desired||20));
            slots.push([hm(v8NextTime),hm(v8NextTime+dur)]);v8NextTime+=dur;
        }
        active.forEach((m,i)=>{m.s=base+slotOffset+Math.floor(i/courtCount);m.f=i%courtCount+1;games.push(m);});
    }
    const audit=scheduleAudit(torneo.matches.concat(games),torneo.slots.concat(slots));
    if(!audit.ok){flash('Impossibile creare il tabellone: '+audit.errors[0]);return false;}
    torneo.slots.push(...slots);torneo.matches.push(...games);
    torneo.knockout={size,qualified:qualified.map(t=>t.id),seeds:seeds.slice(),round:0,byeWinners:[],bronze:false,champion:null,preallocated:true};
    initMatches();reconcileKnockout();saveState();activeTab='gironi';render();
    flash('🏆 Gironi conclusi: tutti i turni fino alla finale sono già programmati.');return true;
}
function reconcileKnockout(){
    const k=torneo.knockout;if(!k||!k.preallocated||!Array.isArray(k.seeds))return false;
    let entrants=k.seeds.slice(),changed=false;
    const rounds=Math.log2(k.size);
    for(let round=0;round<rounds;round++){
        const advancing=[];
        for(let pos=0;pos<entrants.length/2;pos++){
            const ta=entrants[pos*2]||null,tb=entrants[pos*2+1]||null;
            const m=koMatch(round,pos);
            if(round===0 && (!!ta!==!!tb)) { advancing.push(ta||tb);continue; }
            if(!m){advancing.push(null);continue;}
            if(round>0){
                if(ta&&tb){
                    if(m.fr||m.ta!==ta||m.tb!==tb){
                        const x=teamById(ta),y=teamById(tb);
                        if(!x||!y){advancing.push(null);continue;}
                        m.ta=ta;m.tb=tb;m.a=x.members.slice();m.b=y.members.slice();
                        delete m.fr;delete m.pending;delete scores[m.id];delete m.padelResult;delete m.padelRule;changed=true;
                    }
                } else if(!m.fr||m.ta||m.tb){
                    // Dopo la riapertura di un precedente risultato, il futuro
                    // incontro torna in attesa (se non già confermato).
                    if(!scoreCompleted(m)){
                        m.ta=null;m.tb=null;delete m.a;delete m.b;m.fr=1;m.pending=true;
                        delete scores[m.id];delete m.padelResult;delete m.padelRule;changed=true;
                    }
                }
            }
            // La presenza di UNA sola squadra in un turno successivo NON è un bye.
            // Il bye è possibile soltanto nell'abbinamento iniziale delle teste di serie.
            advancing.push(ta&&tb?koWinner(m):null);
        }
        entrants=advancing;
    }
    const champion=entrants.length===1?entrants[0]:null;
    if((k.champion||null)!==champion){k.champion=champion;changed=true;}
    const pending=torneo.matches.filter(m=>m.stage==='ko'&&!m.fr&&!scoreCompleted(m));
    const nextRound=pending.length?Math.min(...pending.map(m=>m.round)):rounds-1;
    if(k.round!==nextRound){k.round=nextRound;changed=true;}
    if(k.bronze){const bronze=torneo.matches.find(m=>m.placement===3);
      if(bronze&&semifinalLosers().length!==2&&!scoreCompleted(bronze)){torneo.matches=torneo.matches.filter(m=>m!==bronze);delete scores[bronze.id];if(bronze.s===torneo.slots.length-1&&!torneo.matches.some(m=>m.s===bronze.s))torneo.slots.pop();changed=true;}
      if(createBronzeMatch())changed=true;
    }
    return changed;
}
function autoProgressKnockout(){
    if(torneo.formatType!=='coppie'||torneo.phaseMode!=='groups'||!(torneo.groups||[]).length)return;
    if(!torneo.knockout){if(finalsReady())startFinals();return;}
    if(torneo.knockout.preallocated){if(reconcileKnockout()){saveState();render();}return;}
    // Un tabellone storico mantiene gli incontri già giocati e non viene riscritto.
}
function advanceFinals(){
    // Retrocompatibilità: il pulsante non serve più nei nuovi tabelloni.
    if(torneo.knockout?.preallocated){autoProgressKnockout();return true;}
    return false;
}
function createBronzeMatch(){
    const k=torneo.knockout;
    if(!k?.bronze||!k.preallocated||k.size<4)return false;
    const losers=semifinalLosers();if(losers.length!==2)return false;
    const existing=torneo.matches.find(m=>m.placement===3);
    const a=teamById(losers[0]),b=teamById(losers[1]);if(!a||!b)return false;
    if(existing){if(existing.ta===a.id&&existing.tb===b.id)return false;if(scoreCompleted(existing))return false;
      existing.ta=a.id;existing.tb=b.id;existing.a=a.members.slice();existing.b=b.members.slice();delete scores[existing.id];delete existing.padelResult;delete existing.padelRule;return true;}
    const finalRound=Math.log2(k.size)-1;
    const final=torneo.matches.find(m=>m.stage==='ko'&&m.round===finalRound);
    if(!final)return false;
    let slot=final.s,court=null;
    for(let f=1;f<=torneo.numCourts;f++)if(!torneo.matches.some(m=>m.s===slot&&m.f===f)){court=f;break;}
    if(court==null){
        // Un solo campo o turno pieno: turno extra subito dopo la fase finale.
        const end=torneo.slots.at(-1)?.[1]||torneo.startTime;
        const duration=torneo.timePerSlot||20;
        slot=torneo.slots.length;torneo.slots.push([end,hm((tmin(end)||600)+duration)]);
        court=1;
    }
    torneo.matches.push({s:slot,f:court,a:a.members.slice(),b:b.members.slice(),ta:a.id,tb:b.id,placement:3,extra:true,official:false});
    initMatches();return true;
}
function setBronzeEnabled(enabled){
    const k=torneo.knockout;if(!k?.preallocated)return;
    if(!enabled){
        const m=torneo.matches.find(x=>x.placement===3);
        if(m&&scoreCompleted(m)){flash('La finale 3°/4° è già stata giocata: riapri il risultato prima di disattivarla.');render();return;}
        if(m){torneo.matches=torneo.matches.filter(x=>x!==m);delete scores[m.id];
            if(m.s===torneo.slots.length-1&&!torneo.matches.some(x=>x.s===m.s))torneo.slots.pop();}
    }
    k.bronze=enabled;if(enabled)createBronzeMatch();
    saveState();render();
    flash(enabled?'🥉 Finale 3°/4° attivata: verrà inserita non appena si conosceranno le semifinaliste sconfitte.':'Finale 3°/4° disattivata.');
}
function knockoutTreeHTML(k,scoreFor=R,teamName=id=>teamById(id)?.label||id,mm=torneo.matches){
    if(!k||!Array.isArray(k.seeds))return '<p class="notice">Questo tabellone è stato creato con una versione precedente. Per avere l’albero automatico, annullalo e ricrealo dopo aver salvato i risultati dei gironi.</p>';
    const size=k.size,rounds=Math.log2(size),map=new Map(mm.filter(m=>m.stage==='ko'&&m.bracketPos!=null).map(m=>[m.round+':'+m.bracketPos,m]));
    const height=Math.max(220,size/2*113),width=rounds*204+(rounds-1)*27,sh=height-36,wires=[];
    for(let rd=0;rd<rounds-1;rd++){
        const n=size/2**(rd+1),x=rd*231+204,mid=x+13;
        for(let j=0;j<n/2;j++){
            const y1=36+(2*j+.5)*sh/n,y2=36+(2*j+1.5)*sh/n,ym=(y1+y2)/2;
            wires.push(`<path d="M ${x} ${y1} H ${mid} V ${y2} M ${x} ${y2} H ${mid} M ${mid} ${ym} H ${x+27}"/>`);
        }
    }
    const wireSVG=`<svg class="bracket-wires" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" fill="none" stroke="var(--ac)" stroke-width="2" opacity="0.55">${wires.join('')}</svg>`;
    let entrants=k.seeds.slice(),columns=[];
    for(let round=0;round<rounds;round++){
        const next=[],nodes=[];
        for(let i=0;i<entrants.length;i+=2){
            const pos=i/2,ta=entrants[i],tb=entrants[i+1],m=map.get(round+':'+pos);
            const r=m?scoreFor(m):{},decided=!!(m&&scoreCompleted(m)&&koWinner(m));
            const winner=decided?koWinner(m):(round===0?(ta&&!tb?ta:tb&&!ta?tb:null):null);
            next.push(winner);
            const names=[[ta,'a'],[tb,'b']].map(([id,side])=>`<div class="bn-team ${id&&winner===id?'winner':''}"><span>${id?esc(teamName(id)):round===0?'BYE':'In attesa'}</span><span class="bn-score">${decided?(sportNow()==='padel'?esc(v8ScoreText(m)):r[side]??''):''}</span></div>`).join('');
            const tag=m?`${koRoundName(size,round)} · Campo ${m.f} · ${esc(torneo.slots[m.s]?.[0]||'')}`:(winner?'Passaggio diretto':'Da definire');
            nodes.push(`<div class="bracket-node ${!ta&&!tb?'waiting':''} ${round===rounds-1?'last':''}"><div class="bn-tag">${tag}</div>${names}</div>`);
        }
        columns.push(`<div class="bracket-column"><h4>${koRoundName(size,round)}</h4><div class="bracket-stack">${nodes.join('')}</div></div>`);
        entrants=next;
    }
    return `<div class="bracket-scroll"><div class="bracket-tree" style="height:${height}px">${wireSVG}${columns.join('')}</div></div>`;
}
function semifinalLosers() {
    const k=torneo.knockout;if(!k||!Array.isArray(k.seeds)||k.size<4)return [];
    const sr=Math.log2(k.size)-2;

function finalRankings() {
    const k=torneo.knockout;if(!k?.champion)return [];
    const all=groupRanks().flat(),ids=new Set(),rows=[];
    const add=(id,place,note)=>{if(id&&!ids.has(id)){rows.push({id,place,note});ids.add(id);}};
    add(k.champion,'1°','Campione');
    const lastRound=Math.log2(k.size)-1;
    const final=torneo.matches.find(m=>m.stage==='ko'&&m.round===lastRound);
    add(koLoser(final),'2°','Finalista');
    const semis=semifinalLosers(),bronze=torneo.matches.find(m=>m.placement===3);
    if(semis.length===2&&bronze&&koWinner(bronze)&&semis.includes(bronze.ta)&&semis.includes(bronze.tb)){
        add(koWinner(bronze),'3°','Terzo posto');add(koLoser(bronze),'4°','Quarto posto');
    } else semis.forEach(id=>add(id,'3° pari merito','Semifinalista'));
    for(let round=lastRound-2;round>=0;round--){
        const loser=torneo.matches.filter(m=>m.stage==='ko'&&m.round===round).map(koLoser).filter(Boolean);
        const n=rows.length+1;
        loser.forEach(id=>add(id,n+'° pari merito','Eliminato: '+koRoundName(k.size,round)));
    }
    const ranks=groupRanks();
    const notQualified=all.filter(x=>!ids.has(x.id)).sort((a,b)=>compareAcross(a,b,ranks));
    notQualified.forEach(x=>add(x.id,rows.length+1+'°','Fase a gironi'));
    return rows;
}

function saveMatchEdit(){
    const selected=[...document.querySelectorAll('.msel')].map(x=>x.value);
    if(selected.length!==4||selected.some(x=>!x)||new Set(selected).size!==4){flash('Seleziona quattro giocatori diversi.');return;}
    const m=torneo.matches.find(x=>x.id===editingMatch);if(!m)return;
    if(torneo.matches.some(x=>x!==m&&!x.fr&&x.s===m.s&&[...(x.a||[]),...(x.b||[])].some(n=>selected.includes(n)))){flash('Uno dei giocatori è già su un altro campo nello stesso turno.');return;}
    const ta=teamsNow().find(t=>t.members.includes(selected[0])&&t.members.includes(selected[1]));
    const tb=teamsNow().find(t=>t.members.includes(selected[2])&&t.members.includes(selected[3]));
    const groupSel=document.getElementById('extraGroup');
    const stage=m.extra&&groupSel?(groupSel.value===''?undefined:'group'):m.stage;
    const group=stage==='group'&&m.extra&&groupSel?+groupSel.value:m.group;
    const placement=+document.getElementById('extraPlacement')?.value===3?3:undefined;
    const include=[...document.querySelectorAll('.player-valid')].map(x=>x.checked);
    const excluded=selected.filter((n,i)=>!include[i]);
    if((stage==='group'||stage==='ko'||placement===3)&&(!ta||!tb||ta.id===tb.id)){flash('Per gironi e finali sono necessarie due coppie fisse valide.');return;}
    if(stage==='group'){
        if(excluded.length){flash('Una gara ufficiale dei gironi deve valere per tutti e quattro. Per i punti individuali, seleziona Nessun girone.');return;}
        if(!(torneo.groups?.[group]||[]).includes(ta.id)||!(torneo.groups?.[group]||[]).includes(tb.id)){flash('Le squadre del recupero devono appartenere allo stesso girone.');return;}
        if(torneo.knockout){flash('Annulla prima il tabellone: i risultati dei gironi sono già definitivi.');return;}
    }
    if(stage==='group'){
        const duplicate=torneo.matches.some(other=>other!==m&&other.stage==='group'&&other.group===group&&
            ((other.ta===ta.id&&other.tb===tb.id)||(other.ta===tb.id&&other.tb===ta.id)));
        if(duplicate){flash('Questo incontro è già programmato nel girone: modifica la partita originale invece di duplicarla.');return;}
    }
    if(placement===3){
        if(stage==='group'||excluded.length){flash('La finale 3°/4° posto non è una gara di girone e deve avere quattro giocatori abilitati.');return;}
        const losers=semifinalLosers();
        if(losers.length!==2||!losers.includes(ta.id)||!losers.includes(tb.id)) {flash('Per il 3°/4° posto scegli le due semifinaliste sconfitte.');return;}
        if(torneo.matches.some(x=>x!==m&&x.placement===3)){flash('La finale per il terzo posto è già stata inserita.');return;}
    }
    if(m.stage==='ko'&&JSON.stringify(selected)!==JSON.stringify([...(m.a||[]),...(m.b||[])])){flash('Le coppie delle eliminatorie sono determinate dal tabellone, non modificabili qui.');return;}
    const old=[...(m.a||[]),...(m.b||[])];
    const changed=JSON.stringify(old)!==JSON.stringify(selected);
    if(selected.some(n=>!isValidPlayer(n))){flash('Giocatore non riconosciuto.');return;}
    if(torneo.formatType==='coppie'&&!m.extra&&(!ta||!tb||ta.id===tb.id)){flash('Seleziona due coppie fisse valide.');return;}
    if(scoreCompleted(m)&&changed){flash('Riapri prima il risultato per cambiare i partecipanti.');return;}
    const [start,end]=torneo.slots[m.s]||[];
    const conflicts=selected.map(n=>torneo.players.find(p=>p.name===n)).filter(p=>p&&((p.from&&tmin(start)<tmin(p.from))||(p.to&&tmin(end)>tmin(p.to))));
    if(conflicts.length&&!confirm('Disponibilità non rispettata ('+start+'–'+end+'):\n'+conflicts.map(p=>p.name+': '+(p.from||'inizio')+'–'+(p.to||'fine')).join('\n')+'\nInserire comunque la partita?'))return;
    if(!v9Checkpoint('modifica manuale partita'))return;
    if(changed){delete scores[m.id];delete m.padelResult;delete m.padelRule;}
    m.a=selected.slice(0,2);m.b=selected.slice(2);delete m.fr;
    m.official=excluded.length!==4;
    if(excluded.length && excluded.length<4)m.x=excluded;else delete m.x;
    if(ta&&tb){m.ta=ta.id;m.tb=tb.id;}else{delete m.ta;delete m.tb;}
    if(stage)m.stage=stage;else delete m.stage;
    if(stage==='group')m.group=group;else delete m.group;
    if(placement)m.placement=3;else delete m.placement;
    document.getElementById('modal')?.remove();saveState();render();
}

function v6ValidateBackup(obj){
   if(!obj||obj.schema!=='beach-torneo-backup'||obj.version!==1)throw Error('Non è un backup V6 riconosciuto.');
   const t=obj.tournament,s=obj.scores;
   if(!t||typeof t!=='object'||!Array.isArray(t.players)||!Array.isArray(t.slots)||!Array.isArray(t.matches)||!s||typeof s!=='object'||Array.isArray(s))throw Error('Backup incompleto o danneggiato.');
   if(t.players.length>500||t.matches.length>10000||t.slots.length>3000)throw Error('Limiti di sicurezza superati.');
   if(t.sport!=null&&!['beach','padel'].includes(t.sport))throw Error('Sport non valido nel backup.');
   if(!['coppie','misto','baraonda'].includes(t.formatType)||!Number.isInteger(+t.numCourts)||+t.numCourts<1||+t.numCourts>20)throw Error('Formato o numero di campi non valido.');
   if(!t.players.every(p=>p&&typeof p.id==='string'&&typeof p.name==='string'&&['M','F'].includes(p.gender))||new Set(t.players.map(p=>p.name)).size!==t.players.length)throw Error('Anagrafica non valida o nomi duplicati.');
   if(!t.slots.every(x=>Array.isArray(x)&&x.length===2&&x.every(y=>/^\d{2}:\d{2}$/.test(y))))throw Error('Orari non validi.');
   const keys=new Set();
   for(const m of t.matches){
      if(!m||!Number.isInteger(m.s)||!Number.isInteger(m.f)||m.s<0||m.s>=t.slots.length||m.f<1)throw Error('Turni o campi danneggiati.');
      const k=m.s+'-'+m.f;if(keys.has(k))throw Error('Due incontri sovrapposti sullo stesso campo.');keys.add(k);
      if(!m.fr&&(!Array.isArray(m.a)||!Array.isArray(m.b)||m.a.length!==2||m.b.length!==2||![...m.a,...m.b].every(x=>typeof x==='string')))throw Error('Partecipanti non validi in una partita.');
   }
   for(const [k,r] of Object.entries(s))if(!r||typeof r!=='object'||!['undefined','boolean','number'].includes(typeof r.d)||!['a','b'].every(z=>r[z]==null||(Number.isInteger(r[z])&&r[z]>=0&&r[z]<=10000)))throw Error('Risultati non validi.');
   // I nomi passano anche in alcune porzioni di HTML storico: blocca markup importato da file esterni.
   const raw=JSON.stringify(obj,(k,v)=>['name','first','surname','notes','subtitle'].includes(k)&&typeof v==='string'?'':(['a','b','x'].includes(k)&&Array.isArray(v)&&v.every(n=>typeof n==='string')?[]:v));if(/[<>]/.test(raw))throw Error('Il backup contiene markup in campi non testuali.');
   return {torneo:t,scores:Object.fromEntries(Object.entries(s).filter(([id])=>/^\d+-[1-9]\d*$/.test(id)))};
}

     if(torneo.formatType==='misto'&&sex[m.a[0]]&&sex[m.a[1]]&&sex[m.b[0]]&&sex[m.b[1]]&&[sex[m.a[0]],sex[m.a[1]]].sort().join('')!==[sex[m.b[0]],sex[m.b[1]]].sort().join(''))mismatch++;
   }

function v6MakeCandidate(cfg,horizon,attempt){
 const {cut,courts,dur,start,people,oldPrefix,pinned,mode,units,needed}=cfg;
 const pMap=Object.fromEntries(people.map(p=>[p.name,p])),ps=people.map(p=>p.name),tStart=start;
 const history=v6HistStats(oldPrefix,pinned),allKept=[...oldPrefix,...pinned];
 const occ=Object.fromEntries(ps.map(n=>[n,new Set(history.played[n]||[])]));
 const quotas=Object.assign({},needed);const selected=units.filter(u=>u.remaining>0);
 const total=selected.reduce((a,u)=>a+u.remaining,0);
 const ext=(mode==='coppie'?(2-total%2)%2:(4-total%4)%4);
 const eligibleExtra=units.filter(u=>u.members.every(n=>{const p=pMap[n];return p && (!p.to||tmin(p.to)>tStart);})).slice();
 if(ext>eligibleExtra.length)return null;
 // distribuisci equamente gli eventuali incontri extra fuori classifica
 const extras={};const chosen=eligibleExtra.sort((a,b)=>(history.physical[a.members[0]]||0)-(history.physical[b.members[0]]||0)+(Math.random()-.5)*3).slice(0,ext);
 for(const u of chosen)extras[u.id]=1;
 for(const u of units)quotas[u.id]=(quotas[u.id]||0)+(extras[u.id]||0);
 const gamesNeed=Math.ceil(total/(mode==='coppie'?2:4));
 const games=[],filled=new Set(allKept.filter(m=>!m.fr).map(m=>m.s+':'+m.f));
 const usedSlot={};for(const m of allKept.filter(m=>!m.fr)) {const ids=[...(m.a||[]),...(m.b||[])];for(const n of ids)(usedSlot[m.s]||=new Set()).add(n);}
 const allSamePrefix=oldPrefix.concat(pinned);
 const rawMates=Object.assign({},history.mates),rawOpp=Object.assign({},history.opp);
 const endAt=slot=>tStart+(slot-cut)*dur;
 const canPlayer=(n,s)=>{const p=pMap[n],t=endAt(s);return p&&(!p.from||t>=tmin(p.from))&&(!p.to||t+dur<=tmin(p.to));};
 const balanceScore=(n,s,unitId=n)=>{const left=quotas[unitId]||0;if(!left)return -1000;
   const remainingWindows=Array.from({length:Math.max(0,horizon-(s-cut))},(_,i)=>s+i).filter(ss=>canPlayer(n,ss)).length;
   if(remainingWindows<left)return -100000;
   const last=occ[n]?.size?Math.max(...occ[n]):-20;
   const series=occ[n]?.has(s-1)&&occ[n]?.has(s-2)?-850:occ[n]?.has(s-1)?-20:0;
   return left/(remainingWindows+0.4)*240+left*8+series+(Math.random()-.5)*Math.max(10,attempt%6*14);
 };
 let created=0;
 for(let s=cut;s<cut+horizon;s++){
   const occupied=usedSlot[s]||new Set();
   for(let court=1;court<=courts;court++){
     if(filled.has(s+':'+court)||created>=gamesNeed)continue;
     let best=null;
     for(let sample=0;sample<Math.min(36,12+units.length*2);sample++){
        const eligible=units.filter(u=>(quotas[u.id]||0)>0&&u.members.every(n=>!occupied.has(n)&&canPlayer(n,s)));
        if(eligible.length<(mode==='coppie'?2:4))break;
        let quartet;
        if(mode==='coppie'){
           const ranked=eligible.map(u=>({u,score:balanceScore(u.members[0],s,u.id)})).sort((a,b)=>b.score-a.score);
           const pool=ranked.slice(0,Math.min(ranked.length,Math.max(4,2+sample%5))).map(x=>x.u);
           quartet=v4SeedShuffle(pool).slice(0,2);
        }else{
           let byM=eligible.filter(u=>pMap[u.members[0]].gender==='M'),byF=eligible.filter(u=>pMap[u.members[0]].gender!=='M');
           const nm=byM.reduce((z,u)=>z+(quotas[u.id]||0),0), nf=byF.reduce((z,u)=>z+(quotas[u.id]||0),0);
           const possibilities=mode==='misto'?[2,0,4,1,3]:[-1];
           const typ=possibilities[(sample+Math.floor(Math.random()*3))%possibilities.length];
           const choose=(l,n)=>l.map(u=>({u,score:balanceScore(u.members[0],s,u.id)})).sort((a,b)=>b.score-a.score+(Math.random()-.5)*20).slice(0,Math.min(l.length,n+3)).sort(()=>Math.random()-.5).slice(0,n).map(x=>x.u);
           quartet=typ===-1?choose(eligible,4):[...choose(byM,typ),...choose(byF,4-typ)];
           if(quartet.length!==4)continue;
           if(mode==='misto'&&typ===4&&pMap && nf>nm && sample<Math.floor(36*.8))continue;
           if(mode==='misto'&&typ===0&&nm>nf && sample<Math.floor(36*.8))continue;
        }
        if(!quartet||quartet.length!==(mode==='coppie'?2:4))continue;
        let variants;
        if(mode==='coppie'){variants=[[quartet[0].members,quartet[1].members]];}
        else {const q=quartet.map(u=>u.members[0]);variants=mode==='misto'?v4TeamSplits(q,Object.fromEntries(people.map(p=>[p.name,p.gender]))):[[[q[0],q[1]],[q[2],q[3]]],[[q[0],q[2]],[q[1],q[3]]],[[q[0],q[3]],[q[1],q[2]]]];}
        for(const [a,b] of variants){
          let value=-(quartet.reduce((z,u)=>z+balanceScore(u.members[0],s,u.id),0));
          const composition=t=>t.map(n=>pMap[n]?.gender).sort().join('');
          if(mode==='misto'&&composition(a)!==composition(b))value+=100000;
          if(mode==='misto'&&composition(a)==='MM'&&people.filter(p=>p.gender==='F').length>people.filter(p=>p.gender==='M').length)value+=25000;
          if(mode==='misto'&&composition(a)==='FF'&&people.filter(p=>p.gender==='M').length>people.filter(p=>p.gender==='F').length)value+=25000;
          for(const t of [a,b])value+=(rawMates[v4PairKey(t[0],t[1])]||0)*35;
          for(const x of a)for(const y of b)value+=(rawOpp[v4PairKey(x,y)]||0)*80;
          if(!best||value<best.value)best={a,b,quartet,value};
        }
     }
     if(!best)continue;
     const m={s,f:court,a:best.a,b:best.b,official:true};
     if(mode==='coppie'){m.ta=best.quartet[0].id;m.tb=best.quartet[1].id;}
     games.push(m);filled.add(s+':'+court);created++;
     for(const u of best.quartet){quotas[u.id]--;for(const n of u.members){occupied.add(n);occ[n]?.add(s);}}
     for(const t of [best.a,best.b]){const k=v4PairKey(t[0],t[1]);rawMates[k]=(rawMates[k]||0)+1;}
     for(const x of best.a)for(const y of best.b){const k=v4PairKey(x,y);rawOpp[k]=(rawOpp[k]||0)+1;}
   }
   usedSlot[s]=occupied;
   if(units.some(u=>(quotas[u.id]||0)>Array.from({length:Math.max(0,cut+horizon-s-1)},(_,i)=>s+i+1).filter(ss=>u.members.every(n=>canPlayer(n,ss))).length))return null;
 }
 if(created!==gamesNeed||units.some(u=>(quotas[u.id]||0)!==0))return null;
 // Una presenza extra fisica non deve diventare un punto aggiuntivo per la classifica.
 for(const u of units){let excess=extras[u.id]||0;if(!excess)continue;
   const own=games.filter(m=>u.members.every(n=>[...m.a,...m.b].includes(n)));
   for(const m of own.slice(-excess))m.x=[...new Set([...(m.x||[]),...u.members])];
 }
 const all=[...oldPrefix,...pinned,...games],slots=Array.from({length:cut+horizon},(_,i)=>i<cut?torneo.slots[i]:[hm(endAt(i)),hm(endAt(i)+dur)]);
 const playedNew=new Set();const byPos=new Set();
 for(const m of all.filter(m=>!m.fr)){
    const k=m.s+':'+m.f;if(byPos.has(k))return null;byPos.add(k);
    if(m.s<cut)continue;
    if(m.f>courts)return null;
    for(const n of [...m.a,...m.b]){const p=k+':'+n;const key=m.s+':'+n;if(playedNew.has(key))return null;playedNew.add(key);
       if(!canPlayer(n,m.s))return null;
    }
 }
 const stats=v6Score(games,[...oldPrefix,...pinned],people,cut);
 return {all,slots,games,stats,created,extra:ext,horizon};
}
async function v6RunReplan(){
   const cut=Number(document.getElementById('v6-cutoff')?.value),courts=Number(document.getElementById('v6-courts')?.value),dur=Number(document.getElementById('v6-duration')?.value);
   if(!Number.isInteger(cut)||!Number.isInteger(courts)||courts<1||courts>10||!Number.isInteger(dur)||dur<10||dur>60){flash('Controlla turni, campi e durata.');return;}
   const min=v6LastConfirmed();if(cut<min){flash('Non puoi modificare i turni con risultati confermati.');return;}
   const prefix=torneo.matches.filter(m=>m.s<cut);
   if(prefix.some(m=>!m.fr&&!scoreCompleted(m))){flash('Per bloccare un turno precedente, conferma tutti i suoi risultati (oppure scegli un confine precedente).');return;}
   const pinned=torneo.matches.filter(m=>m.s>=cut&&!m.fr&&(m.extra||m.manual));
   if(pinned.some(m=>m.f>courts)){flash('Una partita extra futura occupa un campo che non sarà disponibile. Spostala prima di riorganizzare.');return;}
   const sig=JSON.stringify({t:torneo,s:scores});
   const start=cut?tmin(torneo.slots[cut-1]?.[1]):tmin(torneo.startTime),people=torneo.players.slice();
   if(start==null){flash('Orario di partenza non valido.');return;}
   const mode=torneo.formatType,T=Math.max(1,torneo.targetMatches||6);
   const history=v6HistStats(prefix,pinned);
   const teamMode=mode==='coppie',baseUnits=teamMode?teamsNow().map(t=>({id:t.id,members:t.members})):people.map(p=>({id:p.name,members:[p.name]}));
   const pMap=Object.fromEntries(people.map(p=>[p.name,p]));
   const units=baseUnits.map(u=>{let counted=teamMode?[...prefix,...pinned].filter(m=>!m.fr&&m.official!==false&&m.a&&m.b&&u.members.every(n=>[...m.a,...m.b].includes(n)&&!(m.x||[]).includes(n))).length:(history.valid[u.id]||0);
      const possible=Math.min(...u.members.map(n=>{

   });

   const remain=units.reduce((z,u)=>z+u.remaining,0);
   const completed=prefix.filter(m=>!m.fr).length;
   const oldRemaining=torneo.matches.filter(m=>m.s>=cut&&!m.fr).length;
   if(pinned.some(m=>[...m.a,...m.b].some(n=>!pMap[n]||pMap[n].to&&tmin(pMap[n].to)<=start))){flash('Una partita manuale futura comprende un giocatore che non è più disponibile: modificala prima di riorganizzare.');return;}
   if(mode==='misto' && (!people.some(p=>p.gender==='M')||!people.some(p=>p.gender==='F'))){flash('Nel misto servono entrambi i generi.');return;}
   const total=remain,per=teamMode?2:4,gamesNeed=Math.ceil(total/per),possiblePeople=units.filter(u=>u.remaining>0).length;
   if(total && possiblePeople<(teamMode?2:4)){flash('Rimangono troppo pochi partecipanti con gare da disputare. Occorrono altri giocatori disponibili o un recupero manuale.');return;}
   const basic=Math.max(1,Math.ceil(gamesNeed/Math.max(1,Math.min(courts,Math.floor(possiblePeople/(teamMode?2:4))))),Math.max(0,...units.map(u=>u.remaining)));

   if(!window.confirm('Conservare integralmente i primi '+cut+' turni e ricalcolare solo i successivi?\n\nPartite future ordinarie: '+oldRemaining+'. Nuove gare necessarie stimate: '+gamesNeed+'.\nGiocatori/squadre con gare ridotte dalle disponibilità: '+shortfalls.length+'.\nNessun dato sarà modificato finché non accetti l’anteprima.'))return;
   document.getElementById('modal')?.remove();v6Working=true;v6CancelRequested=false;
   const notice=document.createElement('div');notice.id='v6-work';notice.className='toast';
   const label=document.createElement('span');label.textContent='🔄 Cerco il miglior calendario futuro…';notice.appendChild(label);
   const stopper=document.createElement('button');stopper.dataset.act='v6-replan-stop';stopper.className='sm';stopper.textContent='Usa il migliore trovato';stopper.style.cssText='margin:8px 0 0;display:block';notice.appendChild(stopper);
   document.body.appendChild(notice);

          if(tries%12===0){label.textContent='🔄 '+tries+' tentativi · '+(best?'proposta valida trovata':'cerco soluzione completa')+' · '+Math.round((performance.now()-begin)/budget*100)+'%';await v5Yield();}

      const box=document.createElement('div');box.id='modal';box.className='modal';box.innerHTML=`<div class="card"><h3 style="margin-top:0">✅ Anteprima riorganizzazione</h3>
       <p class="mu">I primi <b>${cut}</b> turni e tutti i risultati già confermati rimangono invariati. Nessuna modifica è stata ancora applicata.</p>
       <div class="tw"><table class="tb"><tr><th>Indicatore</th><th>Prima</th><th>Proposta</th></tr>
        <tr><td>Turni complessivi</td><td>${torneo.slots.length}</td><td><b>${best.slots.length}</b></td></tr>
        <tr><td>Ora di fine</td><td>${esc(torneo.slots.at(-1)?.[1]||'?')}</td><td><b>${esc(best.slots.at(-1)?.[1]||'?')}</b></td></tr>
        <tr><td>Campi futuri</td><td>${torneo.numCourts}</td><td>${courts}</td></tr>
        <tr><td>Avversari ripetuti</td><td>${oldStats.oppRep}</td><td>${best.stats.oppRep}</td></tr>
        <tr><td>Serie 3+ consecutive</td><td>${oldStats.triple}</td><td>${best.stats.triple}</td></tr>
        <tr><td>Composizioni sbilanciate</td><td>${oldStats.mismatch}</td><td>${best.stats.mismatch}</td></tr>
        </table></div>
       <p class="mu">${tries} calendari provati. Le gare aggiuntive fuori classifica sono indicate automaticamente. I giocatori ritirati conservano i risultati precedenti.</p>
       ${shortfalls.length?`<p class="notice">⚠️ Disponibilità insufficienti: ${shortfalls.map(u=>esc(u.members.join(' + '))+' (−'+u.shortfall+')').join(', ')}. Queste persone giocheranno meno gare valide del previsto.</p>`:''}

       document.body.appendChild(box);
   }finally{v6Working=false;notice.remove();}

  if(!v10LocalEntries().some(x=>x.id===id)){flash('Torneo non trovato.');return;}
  if(!CFG&&v9StorageError){flash('Impossibile cambiare torneo: il salvataggio locale non funziona.');return;}
  const raw=v9Read(v10LocalKey(id))||(id==='legacy'?(v9Read(V9_LOCAL_KEY)||{tournament:v9Read(K_ORG),scores:v9Read('puravida-organizer-scores-v3')}):null);
  if(!raw?.tournament){flash('Il torneo selezionato non dispone di dati locali.');return;}
  V10_LOCAL_ACTIVE=id;_ls.set(V10_ACTIVE_KEY,id);torneo=raw.tournament;scores=raw.scores||{};initMatches();currentSlot=0;activeTab='regole';selP.clear();editingPlayerId=null;render();
}
function v10NewLocal(){
 const name=prompt('Nome del nuovo torneo (sarà indipendente da quello corrente):','Nuovo torneo');if(name===null)return;
 const title=name.trim().slice(0,120);if(!title){flash('Inserisci un nome per il torneo.');return;}
 const sport=confirm('Il nuovo torneo è di PADEL?\nOK = Padel · Annulla = Beach volley')?'padel':'beach';
 const id='l_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,10);
 const next=JSON.parse(JSON.stringify({...defaultTournament,name:title,sport}));
 const saved=JSON.stringify({schema:'beach-torneo-backup',version:1,tournament:next,scores:{}});
 if(!_ls.set(v10LocalKey(id),saved))return;
 V10_LOCAL_ACTIVE=id;torneo=next;scores={};currentSlot=0;activeTab='regole';selP.clear();editingPlayerId=null;v10RegisterLocal();render();flash('Nuovo torneo creato: '+title);
}
function v10Href(id){const u=new URL(location.href);u.searchParams.delete('torneo');if(id)u.searchParams.set('torneo',String(id));return u.href;}
// Gestione intercettata prima dell'handler storico: nessuna azione di torneo
// può ricadere per errore nel gestore dei punteggi.
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act^="v10-"]');if(!b)return;
 e.preventDefault();e.stopImmediatePropagation();
 const a=b.dataset.act;
 if(a==='v10-catalog'){if(LIVE)location.assign(v11HomeHref());else{activeTab='tornei';render();}}
 else if(a==='v10-local-new'&&!LIVE)v10NewLocal();
 else if(a==='v10-local-open'&&!LIVE)v10SwitchLocal(b.dataset.id);

},true);


// --- V11: Architetto (Supabase Auth), mini-organizzatori, link pubblici per slug ---
function v11HomeHref(){const u=new URL(location.href);u.search='';u.hash='';return u.href;}
function v11Href(slug){const u=new URL(v11HomeHref());if(slug)u.searchParams.set('torneo',String(slug));return u.href;}
function v11AuthKey(){return V11_ADMIN_STORE+':'+normUrl(CFGR?.url||'');}
function v11StoreAuth(obj){V11_AUTH=obj;try{if(obj)sessionStorage.setItem(v11AuthKey(),JSON.stringify(obj));else sessionStorage.removeItem(v11AuthKey());}catch(e){flash('La sessione non può essere conservata nel browser.');}}
async function v11AuthFetch(grant,payload,accessToken){
 const c=CFGR;const r=await fetch(normUrl(c.url)+'/auth/v1/'+(grant==='logout'?'logout':'token?grant_type='+grant),{
 method:'POST',headers:{'apikey':c.key,'Content-Type':'application/json',...(accessToken?{'Authorization':'Bearer '+accessToken}:{})},
 body:grant==='logout'?undefined:JSON.stringify(payload)
 });
 const txt=await r.text();let data={};try{data=txt?JSON.parse(txt):{}}catch(e){}
 if(!r.ok)throw Error(data.msg||data.error_description||data.error||'Errore Auth '+r.status);
 return data;
}
async function v11RefreshAdmin(){
 if(!V11_AUTH?.refresh_token)return false;
 try{
  const data=await v11AuthFetch('refresh_token',{refresh_token:V11_AUTH.refresh_token});
  if(!data.access_token||!data.refresh_token)return false;
  v11StoreAuth(data);return true;
 }catch(e){return false;}
}
async function v11AdminRpc(fn,args){
 if(!V11_AUTH?.access_token)throw Error('Accedi come Architetto');
 if(V11_AUTH.expires_at&&V11_AUTH.expires_at*1000<Date.now()+45_000){if(!await v11RefreshAdmin())throw Error('Sessione Architetto scaduta. Accedi nuovamente.');}
 const call=()=>sb('POST','rpc/'+fn,args||{}, {'Authorization':'Bearer '+V11_AUTH.access_token});
 try{return await call();}catch(e){
  if(/401|JWT expired|invalid JWT/i.test(e.message)&&await v11RefreshAdmin())return await call();
  throw e;
 }
}
async function v11RestoreAdmin(){
 try{
   if(!V11_AUTH){const raw=sessionStorage.getItem(v11AuthKey());if(!raw)return false;V11_AUTH=JSON.parse(raw);}
   const allowed=await v11AdminRpc('v11_is_architect',{});
   V11_IS_ARCHITECT=allowed===true;
   if(!V11_IS_ARCHITECT)v11StoreAuth(null);
   return V11_IS_ARCHITECT;
 }catch(e){V11_IS_ARCHITECT=false;v11StoreAuth(null);return false;}
}
async function v11WriteRpc(fn,args){
 if(V11_IS_ARCHITECT)return v11AdminRpc(fn,args);
 return rpc(fn,args);
}
function v11LoginHTML(message=''){
 document.body.classList.add('viewer');
 document.getElementById('v').innerHTML=`<div class="v11-page"><div class="v11-hero"><div class="v11-icon">🏛️</div><h1>Area Architetto</h1><p>Gestione privata di tutti i tornei Beach Volley e Padel.</p></div>
 <div class="card v11-auth-card"><h2>Accesso amministratore</h2>
 ${message?`<p class="v11-alert">${esc(message)}</p>`:''}
 <div class="form-group"><label>Email</label><input id="v11-email" type="email" class="form-control" autocomplete="username" placeholder="email@esempio.it"></div>
 <div class="form-group"><label>Password</label><input id="v11-password" type="password" class="form-control" autocomplete="current-password" placeholder="Password Supabase Auth"></div>
 <button class="sm pri" id="v11-login-btn" data-act="v11-admin-login" style="width:100%;margin:12px 0">Accedi alla dashboard</button>
 <p class="mu">I partecipanti non devono effettuare l'accesso. Aprono direttamente il link del proprio torneo.</p>
 </div></div>`;
}
async function v11AdminEntry(){
 document.body.classList.add('viewer');document.getElementById('v').innerHTML='<div class="card">Verifica della sessione Architetto…</div>';
 if(await v11RestoreAdmin())await v11RenderAdmin();else v11LoginHTML();
}
async function v11AdminLogin(){
 const email=document.getElementById('v11-email')?.value.trim(),password=document.getElementById('v11-password')?.value;
 if(!email||!password){flash('Inserisci email e password.');return;}
 const btn=document.getElementById('v11-login-btn');if(btn){btn.disabled=true;btn.textContent='Accesso…';}
 try{
   const res=await v11AuthFetch('password',{email,password});
   if(!res.access_token||!res.refresh_token)throw Error('Risposta di accesso non valida');
   v11StoreAuth(res);
   if(!await v11RestoreAdmin())throw Error('Questo account non è autorizzato come Architetto. Registra il suo UID nel database.');
   await v11RenderAdmin();
 }catch(e){v11StoreAuth(null);V11_IS_ARCHITECT=false;v11LoginHTML(e.message);}
}
async function v11AdminLogout(){
 const token=V11_AUTH?.access_token;v11StoreAuth(null);V11_IS_ARCHITECT=false;
 if(token)try{await v11AuthFetch('logout',null,token);}catch(e){}
 location.assign(v11HomeHref());
}
let V11_CATALOG=[];
async function v11RenderAdmin(){
 document.body.classList.add('viewer');
 document.getElementById('v').innerHTML='<div class="card">Caricamento dashboard…</div>';
 try{
   V11_CATALOG=await v11AdminRpc('v11_list_tournaments',{});
   const active=V11_CATALOG.filter(x=>x.status==='active').length,arch=V11_CATALOG.length-active;
   const rows=V11_CATALOG.map(t=>`<article class="v11-item"><div class="v11-item-head"><div><h3>${t.sport==='padel'?'🎾':'🏐'} ${esc(t.title||'Torneo')}</h3><p class="mu">${t.sport==='padel'?'Padel':'Beach volley'} · ID ${t.id}</p></div><span class="v11-state ${t.status==='archived'?'archived':''}">${t.status==='archived'?'📦 Archiviato':'● Attivo'}</span></div>
 <div class="v11-url">${esc(v11Href(t.slug))}</div>
 <div class="v11-actions"><a class="sm pri" href="${v11Href(t.slug)}">Gestisci</a>
 <button class="sm" data-act="v11-copy-link" data-id="${t.id}">📋 Link</button>
 <button class="sm" data-act="v11-backup" data-id="${t.id}">⬇️ Backup</button>
 <button class="sm" data-act="v11-password" data-id="${t.id}">🔑 Password</button>
 <button class="sm" data-act="v11-archive" data-id="${t.id}">${t.status==='archived'?'♻️ Riattiva':'📦 Archivia'}</button>
 ${t.status==='archived'?`<button class="sm danger" data-act="v11-delete" data-id="${t.id}">🗑️ Elimina</button>`:''}
 </div></article>`).join('');
   document.getElementById('v').innerHTML=`<div class="v11-page"><div class="v11-hero v11-hero-dash"><div><h1>🏛️ Dashboard Architetto</h1><p>Gestisci tutti i tornei e i mini-organizzatori da un unico posto.</p></div><button class="sm" data-act="v11-logout">Esci</button></div>
   <div class="v11-stats"><div class="card"><strong>${V11_CATALOG.length}</strong><span>Totali</span></div><div class="card"><strong>${active}</strong><span>Attivi</span></div><div class="card"><strong>${arch}</strong><span>Archiviati</span></div></div>
   <div class="v11-bar"><h2>I tuoi tornei</h2><button class="sm pri" data-act="v11-new">＋ Crea torneo</button></div>
   <div class="v11-list">${rows||'<div class="card">Nessun torneo. Creane uno per cominciare.</div>'}</div>
   <p class="mu">I link aprono le pagine pubbliche dei tornei. Da questo dispositivo, mentre sei autenticato come Architetto, puoi anche modificarli senza utilizzare le password dei mini-organizzatori.</p></div>`;
 }catch(e){v11LoginHTML('Impossibile caricare la dashboard: '+e.message);}
}
function v11Modal(content){
 document.getElementById('modal')?.remove();const d=document.createElement('div');d.id='modal';d.className='modal';d.innerHTML='<div class="card" style="max-width:500px">'+content+'</div>';document.body.appendChild(d);return d;
}
function v11Slug(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,48)||'torneo';}
function v11NewDialog(){
 v11Modal(`<h3>＋ Crea nuovo torneo</h3><p class="mu">Solo l'Architetto può creare un torneo online. La password dedicata sarà utilizzata dal mini-organizzatore.</p>
 <div class="form-group"><label>Nome torneo</label><input class="form-control" id="v11-new-name" maxlength="120" placeholder="Es. Padel Open"></div>
 <div class="form-group"><label>Sport</label><select id="v11-new-sport" class="form-control"><option value="beach">🏐 Beach volley</option><option value="padel">🎾 Padel</option></select></div>
 <div class="form-group"><label>Password mini-organizzatore (12–72 byte)</label><input type="password" class="form-control" id="v11-new-pin" autocomplete="new-password"></div>
 <p class="mu">Ogni torneo avrà un indirizzo pubblico diverso. Conserva la password specifica: non compare nei backup.</p>
 <div style="display:flex;gap:8px;justify-content:flex-end"><button class="sm" data-act="close-modal">Annulla</button><button class="sm pri" id="v11-create-btn" data-act="v11-create">Crea torneo</button></div>`);
 document.getElementById('v11-new-name')?.focus();
}
function v11ValidPassword(p){const n=new TextEncoder().encode(p||'').length;return n>=12&&n<=72&&p===p.trim()&&!['CAMBIA-QUESTO-PIN','SCEGLI-UNA-PASSWORD-NUOVA'].includes(p);}
async function v11Create(){
 const name=document.getElementById('v11-new-name')?.value.trim(),sport=document.getElementById('v11-new-sport')?.value,pin=document.getElementById('v11-new-pin')?.value;
 if(!name||name.length>120||!['beach','padel'].includes(sport)||!v11ValidPassword(pin)){flash('Controlla nome, sport e password (12–72 byte senza spazi ai bordi).');return;}
 const btn=document.getElementById('v11-create-btn');btn.disabled=true;
 try{
  const obj={...defaultTournament,name,sport},slug=v11Slug(name);
  const id=await v11AdminRpc('v11_create_tournament',{p_json:JSON.stringify(obj),p_slug:slug,p_pin:pin});
  if(!Number.isInteger(id)||id<1)throw Error('ID non valido');
  document.getElementById('modal')?.remove();await v11RenderAdmin();flash('Torneo creato. Puoi già condividere il suo link.');
 }catch(e){flash('Creazione fallita: '+e.message);}finally{if(btn.isConnected)btn.disabled=false;}
}
function v11Selected(id){return V11_CATALOG.find(t=>t.id===Number(id));}
async function v11ToggleArchive(id){
 const t=v11Selected(id);if(!t)return;
 const archive=t.status==='active';
 if(!confirm((archive?'Archiviare':'Riattivare')+' il torneo «'+t.title+'»?'+(archive?' Rimarrà consultabile dal link pubblico, ma il mini-organizzatore non potrà più modificarlo.':'')))return;
 try{await v11AdminRpc('v11_archive_tournament',{p_tournament_id:t.id,p_archived:archive});await v11RenderAdmin();}catch(e){flash('Operazione fallita: '+e.message);}
}
function v11PasswordDialog(id){
 const t=v11Selected(id);if(!t)return;
 v11Modal(`<h3>🔑 Nuova password mini-organizzatore</h3><p>Il torneo <b>${esc(t.title)}</b> avrà una nuova password. Tutte le vecchie sessioni organizzatore verranno invalidate.</p>
 <div class="form-group"><label>Nuova password (12–72 byte)</label><input type="password" class="form-control" id="v11-rotate-pin" autocomplete="new-password"></div>
 <div style="display:flex;gap:8px;justify-content:flex-end"><button class="sm" data-act="close-modal">Annulla</button><button class="sm pri" data-act="v11-rotate-submit" data-id="${t.id}">Conferma cambio password</button></div>`);
}
async function v11RotatePin(id){
 const p=document.getElementById('v11-rotate-pin')?.value;if(!v11ValidPassword(p)){flash('Password non valida (12–72 byte).');return;}
 try{await v11AdminRpc('v11_reset_tournament_password',{p_tournament_id:Number(id),p_pin:p});document.getElementById('modal')?.remove();flash('Password aggiornata e vecchie sessioni annullate.');}catch(e){flash('Cambio password non riuscito: '+e.message);}
}
async function v11DownloadBackup(id){
 const t=v11Selected(id);if(!t)return;
 const [data,rows]=await Promise.all([
   sb('GET','tournament?select=json&id=eq.'+t.id+'&limit=1'),
   sb('GET','scores?select=id,a,b,d&tournament_id=eq.'+t.id)
 ]);
 if(!data?.[0]?.json)throw Error('Il torneo non contiene ancora dati di configurazione.');
 const sc=Object.fromEntries(rows.map(x=>[x.id,{a:x.a,b:x.b,d:x.d}]));
 const backup={schema:'beach-torneo-backup',version:1,tournament:JSON.parse(data[0].json),scores:sc};
 const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='backup-'+t.slug+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function v11DeleteDialog(id){
 const t=v11Selected(id);if(!t||t.status!=='archived'){flash('Prima archivia il torneo.');return;}
 v11Modal(`<h3>🗑️ Eliminazione definitiva</h3><p>Eliminare <b>${esc(t.title)}</b>? Spariranno calendario, risultati e password. Operazione irreversibile.</p>
 <p class="v11-alert">Scarica prima un backup JSON dalla dashboard.</p>
 <div class="form-group"><label>Scrivi esattamente il nome del torneo per confermare</label><input class="form-control" id="v11-delete-confirm" autocomplete="off" placeholder="${esc(t.title)}"></div>
 <div style="display:flex;gap:8px;justify-content:flex-end"><button class="sm" data-act="close-modal">Annulla</button><button class="sm danger" data-act="v11-delete-submit" data-id="${t.id}">Elimina definitivamente</button></div>`);
}
async function v11Delete(id){
 const t=v11Selected(id),typed=document.getElementById('v11-delete-confirm')?.value;
 if(!t||t.status!=='archived'||typed!==t.title){flash('Il nome inserito non corrisponde.');return;}
 if(!confirm('ULTIMA CONFERMA: eliminare definitivamente il torneo '+t.title+' e tutti i suoi risultati?'))return;
 try{await v11AdminRpc('v11_delete_tournament',{p_tournament_id:t.id,p_confirm_title:typed});document.getElementById('modal')?.remove();await v11RenderAdmin();flash('Torneo eliminato.');}catch(e){flash('Eliminazione non riuscita: '+e.message);}
}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act^="v11-"]');if(!b)return;
 e.preventDefault();e.stopImmediatePropagation();
 const a=b.dataset.act,id=b.dataset.id;
 if(a==='v11-admin-login'){v11AdminLogin();return;}
 if(!V11_IS_ARCHITECT){flash('Accesso Architetto richiesto');return;}
 if(a==='v11-logout')v11AdminLogout();
 else if(a==='v11-new')v11NewDialog();
 else if(a==='v11-create')v11Create();
 else if(a==='v11-copy-link'){
   const t=v11Selected(id);if(t)navigator.clipboard.writeText(v11Href(t.slug)).then(()=>flash('Link copiato.')).catch(()=>flash('Copia non consentita dal browser.'));
 }
 else if(a==='v11-backup')v11DownloadBackup(id).catch(x=>flash('Backup non riuscito: '+x.message));
 else if(a==='v11-password')v11PasswordDialog(id);
 else if(a==='v11-rotate-submit')v11RotatePin(id);
 else if(a==='v11-archive')v11ToggleArchive(id);
 else if(a==='v11-delete')v11DeleteDialog(id);
 else if(a==='v11-delete-submit')v11Delete(id);
},true);

boot();
</script></body></html>
