name: Collaudo V11.1

on:
  push:
    paths:
      - 'index.html'
      - 'qa/**'
      - '.github/workflows/collaudo.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'qa/**'
      - '.github/workflows/collaudo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-test:
    name: QA browser (mock Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: qa/requisiti.txt
      - name: Install Playwright and Chromium
        run: |
          python -m pip install -r qa/requisiti.txt
          python -m playwright install --with-deps chromium
      - name: Run isolated browser test suites
        run: python qa/esegui_test.py index.html
